[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Remappings enter the compiler metadata, so they are listed in full and auto-detection is off:
# the build is the same whether or not the libraries' own nested submodules are initialised.
auto_detect_remappings = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
]

skip = [
    "lib/openzeppelin-contracts/test/**/*.sol",
    "lib/openzeppelin-contracts/certora/**/*.sol",
    "lib/openzeppelin-contracts/scripts/**/*.sol",
]
